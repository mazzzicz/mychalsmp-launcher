appId: xyz.mychalsmp.launcher
productName: SMPClient
copyright: Copyright © 2026 mychalVidea
directories:
  output: dist
  buildResources: build
files:
  - "src/**/*"
  - "assets/**/*"
  - "node_modules/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  signtoolOptions:
    publisherName: "mychalVidea"
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: SMPClient
  uninstallDisplayName: SMPClient
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

linux:
  maintainer: "mychalVidea <admin@mychalsmp.xyz>"
  target:
    - target: tar.gz
      arch:
        - x64
  category: Game
  icon: build/icon.png
  desktop:
    Name: SMPClient
    Comment: Oficiální herní klient pro síť MYCHAL SMP
    Categories: Game;ActionGame;AdventureGame;
