appId: cz.zasemazi.voldex.client
productName: VoldexClient
copyright: Copyright © 2026 Voldex Studios
compression: "maximum"
directories:
  output: dist
  buildResources: build
files:
  - "src/**/*"
  - "assets/**/*"
  - "node_modules/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  signtoolOptions:
    publisherName: "Voldex Studios"
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Voldex Client
  uninstallDisplayName: Voldex Client (Voldex Studios)
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

linux:
  maintainer: "Voldex Studios <info@zasemazi.cz>"
  target:
    - target: tar.gz
      arch:
        - x64
  category: Game
  icon: build/icon.png
