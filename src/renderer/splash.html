<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Voldex Client — Voldex Studios</title>
    <style>
        @font-face {
            font-family: 'Monocraft';
            src: url('assets/fonts/Monocraft.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Monocraft';
            src: url('assets/fonts/Monocraft-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Monocraft', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-card {
            position: relative;
            width: 390px;
            height: 450px;
            background:
                linear-gradient(180deg, rgba(6, 12, 20, 0.88) 0%, rgba(4, 8, 14, 0.96) 100%),
                url('assets/keyarts/26.2.jpg') center/cover no-repeat;
            border-radius: 18px;
            border: 1px solid rgba(34, 211, 238, 0.28);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 34px 28px 28px;
            box-shadow:
                0 28px 70px rgba(0, 0, 0, 0.92),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            overflow: hidden;
            -webkit-app-region: drag;
            animation: splashEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes splashEnter {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .splash-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 28%, rgba(34, 211, 238, 0.16), transparent 65%);
            pointer-events: none;
        }

        .studio-tag {
            position: relative;
            z-index: 2;
            font-size: 10px;
            letter-spacing: 2.5px;
            color: #67e8f9;
            background: rgba(8, 22, 34, 0.82);
            border: 1px solid rgba(34, 211, 238, 0.25);
            padding: 5px 12px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .center-emblem {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .icon-frame {
            position: relative;
            width: 132px;
            height: 132px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-glow {
            position: absolute;
            inset: -12px;
            border-radius: 28px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.32) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.96); opacity: 0.65; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        .client-icon {
            position: relative;
            width: 120px;
            height: 120px;
            image-rendering: pixelated;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.85));
            animation: iconFloat 3.6s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .title-block {
            text-align: center;
        }

        .client-title {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 2px;
            text-shadow: 0 3px 0 #042f2e, 0 8px 20px rgba(0, 0, 0, 0.8);
        }

        .client-server {
            margin-top: 6px;
            font-size: 11px;
            color: #22d3ee;
            letter-spacing: 1.5px;
        }

        .loader-footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .status-text {
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }

        .status-pct {
            color: #22d3ee;
            font-weight: 700;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(34, 211, 238, 0.22);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 18%;
            background: linear-gradient(90deg, #0d9488 0%, #22d3ee 60%, #a5f3fc 100%);
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
            transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="studio-tag">VOLDEX STUDIOS</div>

        <div class="center-emblem">
            <div class="icon-frame">
                <div class="icon-glow"></div>
                <img src="assets/server-icon.png" alt="Voldex Client" class="client-icon">
            </div>
            <div class="title-block">
                <div class="client-title">VOLDEX CLIENT</div>
                <div class="client-server">voldex.zasemazi.cz</div>
            </div>
        </div>

        <div class="loader-footer">
            <div class="status-row">
                <span class="status-text" id="statusText">Inicializace Voldex Engine...</span>
                <span class="status-pct" id="statusPct">18%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const statusText = document.getElementById('statusText');
        const statusPct = document.getElementById('statusPct');
        const progressFill = document.getElementById('progressFill');

        ipcRenderer.on('splash-status', (event, data) => {
            if (data.text) statusText.textContent = data.text;
            if (typeof data.progress === 'number') {
                const pct = Math.min(100, Math.max(5, Math.round(data.progress)));
                progressFill.style.width = pct + '%';
                if (statusPct) statusPct.textContent = pct + '%';
            }
        });
    </script>
</body>
</html>
