name: Build and Auto-Release Launcher

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Vlastní verze k vydání (např. 2.0.0, prázdné = verze z package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe, .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Apply Custom Version If Provided
        if: "${{ github.event.inputs.custom_version != '' }}"
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('./package.json')); pkg.version = '${{ github.event.inputs.custom_version }}'.replace(/^v/, ''); fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Rust Module (Windows)
        shell: bash
        run: |
          cd native
          cargo build --release
          cp target/release/voldex_native.dll ../src/main/voldex_native.node

      - name: Ensure Build Resources
        shell: bash
        run: |
          mkdir -p build
          [ -f build/icon.ico ] || cp src/renderer/assets/icon.ico build/icon.ico
          [ -f build/icon.png ] || cp src/renderer/assets/logo.png build/icon.png

      - name: Build Windows Packages
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Apply Custom Version If Provided
        if: "${{ github.event.inputs.custom_version != '' }}"
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('./package.json')); pkg.version = '${{ github.event.inputs.custom_version }}'.replace(/^v/, ''); fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Rust Module (Linux)
        shell: bash
        run: |
          cd native
          cargo build --release
          cp target/release/libvoldex_native.so ../src/main/voldex_native.node

      - name: Ensure Build Resources
        shell: bash
        run: |
          mkdir -p build
          [ -f build/icon.ico ] || cp src/renderer/assets/icon.ico build/icon.ico
          [ -f build/icon.png ] || cp src/renderer/assets/logo.png build/icon.png

      - name: Build Linux Package
        run: npx electron-builder --linux tar.gz --dir --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/*.tar.gz
            dist/linux-unpacked/resources/app.asar
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Get Version for Release
        id: pkg_version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare Clean Release Files
        run: |
          cd release-assets
          # Odstranit nepotřebné podpůrné soubory
          rm -f *.blockmap latest*.yml
          
          # Vytvořit neměnné univerzální soubory pro přímé stahování z webu
          SETUP_EXE=$(ls *Setup*.exe 2>/dev/null | head -n 1)
          if [ -n "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" "voldex-client-setup.exe"
          fi
          
          LINUX_TAR=$(ls *.tar.gz 2>/dev/null | head -n 1)
          if [ -n "$LINUX_TAR" ]; then
            cp "$LINUX_TAR" "voldex-client.tar.gz"
          fi

          # Připravit bleskový delta balíček pro všechny generace launcheru (v3, v2 i starší)
          ASAR_FILE=$(find . -name "app.asar" -type f 2>/dev/null | head -n 1)
          if [ -n "$ASAR_FILE" ]; then
            cp "$ASAR_FILE" "update-v3.asar"
            cp "$ASAR_FILE" "update-v2.asar"
            cp "$ASAR_FILE" "update.asar"
            cp "$ASAR_FILE" "app.asar"
          fi
          
          echo "=== Seznam souborů k vydání ==="
          ls -la

      - name: Generate Changelog from Commit Message
        id: changelog
        shell: bash
        run: |
          # 1. Zjistit zprávu posledního commitu (git commit -m "zprava")
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format:"%B" 2>/dev/null || true)
          fi
          
          # Pokud je commit pouze generický bump "Release v...", zkusit vzít předchozí commit zprávu
          if [[ "$COMMIT_MSG" =~ ^Release\ v[0-9] ]] || [[ "$COMMIT_MSG" =~ ^v[0-9] ]]; then
            PREV_MSG=$(git log -2 --pretty=format:"%s" 2>/dev/null | tail -n +2 | head -n 1 || true)
            if [ -n "$PREV_MSG" ] && [[ ! "$PREV_MSG" =~ ^Release\ v ]]; then
              COMMIT_MSG="$PREV_MSG"
            fi
          fi

          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Aktualizace launcheru v${{ steps.pkg_version.outputs.version }}"
          fi

          echo "Changelog pro release: $COMMIT_MSG"
          printf "%s\n" "$COMMIT_MSG" > release_notes.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: "Voldex Client v${{ steps.pkg_version.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            release-assets/*.exe
            release-assets/*.tar.gz
            release-assets/*.asar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Old Releases (Keep only latest)
        run: |
          CURRENT_TAG="v${{ steps.pkg_version.outputs.version }}"
          echo "🌟 Nejnovější vydaná verze: $CURRENT_TAG"
          echo "🧹 Kontroluji a mažu všechny starší releases..."

          ALL_TAGS=$(gh release list --limit 100 --json tagName | jq -r '.[].tagName' || true)

          for tag in $ALL_TAGS; do
            if [ "$tag" != "$CURRENT_TAG" ] && [ -n "$tag" ]; then
              echo "🗑️ Odstraňuji starý release $tag..."
              gh release delete "$tag" --yes --cleanup-tag || gh release delete "$tag" --yes || true
            fi
          done

          echo "✅ Ponechán pouze 1 nejnovější release: $CURRENT_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
